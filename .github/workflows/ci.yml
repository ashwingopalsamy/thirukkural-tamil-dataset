name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt mlcroissant==1.1.1
      - name: Tag matches the version in release/release.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(python -c 'import json; print(json.load(open("release/release.json"))["version"])')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, release.json says $want"; exit 1; }
      - name: Validators
        run: python -m tkcore.validate
      - name: Release gate
        run: python -m tkcore.validate --gate
      - name: Build Parquet
        run: python -m tkcore.build --parquet
      - name: Release folder, card and Croissant are current
        run: python -m tkcore.release --check
      - name: Tests
        run: python -m pytest
      - name: Croissant validates
        run: mlcroissant validate --jsonld release/croissant.json
      - name: Byte-identical rebuild
        run: |
          sha256sum dist/core/*.parquet > /tmp/core.sha
          cp dist/hf/MANIFEST.json /tmp/manifest.json
          rm -rf dist && python -m tkcore.build --parquet && python -m tkcore.release --check
          sha256sum -c /tmp/core.sha
          cmp /tmp/manifest.json dist/hf/MANIFEST.json
      - name: docs/ is current
        run: |
          python -m tkcore.site
          git diff --exit-code -- docs
          test -z "$(git status --porcelain -- docs)"
      - name: Summary
        run: |
          root=$(python -c 'import json; print(json.load(open("dist/hf/MANIFEST.json"))["kurals_root_sha256"])')
          echo "kurals root sha256: \`$root\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/hf
          if-no-files-found: error
